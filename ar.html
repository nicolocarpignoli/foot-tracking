<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR T-Shoes</title>
    <link rel="stylesheet" href="./style.css" type="text/css">
    <link rel="stylesheet" href="./ar.css" type="text/css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans&family=Quicksand:wght@400;700&family=Zilla+Slab:wght@500;700&display=swap" rel="stylesheet">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <script type="text/javascript" src="./index.js"></script>
</head>
<body>
    <main class="ar">
        <header>
            <a href="index">
                <div class="img-container">
                    <img src="assets/logod.png" aria-hidden />
                </div>
            </a>
        </header>
        <article class="info">
            <h1>ESEMPIO, NIKE, 35/48</h1>
            <span> Semirigido potenziato </span>
            <ul>
                <li>
                    Tessuto TECH Traspirante
                </li>
                <li>
                    Contrafforte stabilizzante e imbottito
                </li>
                <li>
                    Tomaia con fodera interna Total Comfort
                </li>
                <li>
                    Pro Extra Fit con ampia vestibilità
                </li>
            </ul>
        </article>
        <model-viewer
            src="./assets/nike.glb"
            ar
            camera-controls
            alt="Una scarpa in 3D"
            xr-environment>
        <button slot="ar-button">Vedi nel tuo spazio</button>
        </model-viewer>
    </main>
</body>
</html>
